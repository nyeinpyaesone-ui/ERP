services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: erp_solution-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: erp_solution-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API (v2.2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_solution-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Web App
  frontend:
    build:
      context: ./backend/frontend-react
      dockerfile: Dockerfile
    container_name: erp-frontend
    ports:
      # nginx inside the image listens on 80 (see backend/frontend-react/Dockerfile)
      - "3000:80"
    # No API URL env here: the frontend is a static Vite build served by nginx,
    # which proxies /api to the backend (backend/frontend-react/nginx.conf).
    # The old REACT_APP_API_URL was never read by the source — src/api/axios.js
    # uses VITE_API_URL, and runtime env cannot reach a pre-built bundle anyway.
    depends_on:
      - backend

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: erp_solution-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
