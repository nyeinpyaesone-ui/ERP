apiVersion: v1
kind: Secret
metadata:
  name: erp_solution-secrets
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database
  DB_USER: "erp_user"
  DB_PASSWORD: "CHANGE_THIS_SECURE_PASSWORD_IN_PRODUCTION"
  DB_URL: "postgresql://erp_user:CHANGE_THIS_SECURE_PASSWORD_IN_PRODUCTION@erp_solution-postgres:5432/erp_solution_production"

  # Redis
  REDIS_PASSWORD: "CHANGE_THIS_REDIS_PASSWORD"
  REDIS_URL: "redis://:CHANGE_THIS_REDIS_PASSWORD@erp_solution-redis:6379/0"

  # JWT
  JWT_SECRET: "CHANGE_THIS_TO_256_BIT_RANDOM_SECRET_KEY"
  JWT_REFRESH_SECRET: "CHANGE_THIS_TO_ANOTHER_256_BIT_SECRET"

  # API Keys - REPLACE WITH YOUR ACTUAL KEYS
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_OPENAI_API_KEY"
  SENTRY_AUTH_TOKEN: "REPLACE_WITH_YOUR_SENTRY_TOKEN"
  
  # AWS/S3 (if using)
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_YOUR_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET"

  # SMTP
  SMTP_USER: "REPLACE_WITH_SMTP_USER"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"

  # Payment Gateways
  KBZPAY_API_KEY: "REPLACE_WITH_KBZPAY_KEY"
  KBZPAY_MERCHANT_ID: "REPLACE_WITH_KBZPAY_MERCHANT"
  WAVE_API_KEY: "REPLACE_WITH_WAVE_KEY"
  WAVE_MERCHANT_ID: "REPLACE_WITH_WAVE_MERCHANT"

  # OAuth
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  FACEBOOK_APP_ID: "REPLACE_WITH_FACEBOOK_APP_ID"
  FACEBOOK_APP_SECRET: "REPLACE_WITH_FACEBOOK_APP_SECRET"

  # Encryption
  ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_KEY"
  SIGNING_KEY: "REPLACE_WITH_32_BYTE_KEY"

