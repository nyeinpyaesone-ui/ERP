apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp_solution

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - rbac.yaml
  - network-policy.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  # worker-deployment removed: no worker image is built by CI (see _archive/k8s-worker/)
  - ingress.yaml
  - cronjob.yaml

commonLabels:
  app.kubernetes.io/part-of: erp_solution
  app.kubernetes.io/managed-by: kustomize

images:
  - name: docker.io/powerrangeranikg/erp-solution-backend
    newTag: latest
  - name: docker.io/powerrangeranikg/erp-solution-frontend
    newTag: latest

