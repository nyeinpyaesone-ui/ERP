name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/erp-solution-backend:${{ github.ref_name }}
            ${{ vars.DOCKER_USER }}/erp-solution-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/frontend-react
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/erp-solution-frontend:${{ github.ref_name }}
            ${{ vars.DOCKER_USER }}/erp-solution-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
