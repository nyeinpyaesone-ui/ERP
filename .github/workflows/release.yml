name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a GitHub Release for"
        required: true
        type: string

permissions:
  contents: write

# Serialize releases: a second tag push while one is publishing would race the
# `gh release create` for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the previous tag can be found for comparison notes.
          fetch-depth: 0

      # CI already built and pushed the tag images on this same ref
      # (docker-backend / docker-frontend, `type=ref,event=tag`). This job only
      # publishes the GitHub Release record — it must not rebuild or redeploy,
      # so production deploys stay owned by ci.yml's deploy-production job.
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} not found in the repository"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify referenced images exist
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USER: ${{ vars.DOCKER_USER }}
        run: |
          set -euo pipefail
          for image in erp-solution-backend erp-solution-frontend; do
            ref="${DOCKER_USER}/${image}:${TAG}"
            echo "Checking ${ref}"
            if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::Image ${ref} not found in the registry — CI image build must succeed before releasing"
              exit 1
            fi
          done

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            # Section headings are `## [<version>]` or `## <version>`; stop at
            # the next level-2 heading. Falls through to a commit list when the
            # changelog has no entry for this tag yet.
            awk -v tag="${TAG#v}" '
              BEGIN { found = 0 }
              /^## / {
                if (found) exit
                line = $0
                gsub(/^##[[:space:]]*\[?/, "", line)
                gsub(/\]?[[:space:]]*$/, "", line)
                gsub(/^[^0-9]*/, "", line)
                if (index(line, tag) > 0) { found = 1; print; next }
              }
              found { print }
            ' CHANGELOG.md > changelog-section.md || true

            if [ -s changelog-section.md ]; then
              cp changelog-section.md release-notes.md
            fi
          fi

          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${TAG}; using commit list"
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            {
              echo "## Changes in ${TAG}"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=format:'- %s (%h)' "$PREV..${TAG}"
              else
                git log --pretty=format:'- %s (%h)' --max-count=50 "$TAG"
              fi
            } > release-notes.md
            echo >> release-notes.md
          fi
          echo "Notes: $(wc -l < release-notes.md) lines"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ERP SOLUTION $TAG" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Attach image references to the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USER: ${{ vars.DOCKER_USER }}
        run: |
          set -euo pipefail
          {
            echo
            echo "## Container images"
            echo
            echo '```'
            echo "${DOCKER_USER}/erp-solution-backend:${TAG}"
            echo "${DOCKER_USER}/erp-solution-frontend:${TAG}"
            echo '```'
          } >> release-notes.md
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md