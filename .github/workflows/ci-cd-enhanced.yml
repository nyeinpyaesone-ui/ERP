# Archived CI/CD workflow

This workflow is retained for history and manual reference only.

The repository's active CI/CD implementation is:
- `.github/workflows/ci.yml` for tests, quality checks, builds, security scans, and approved deployments.
- `.github/workflows/codeql.yml` for CodeQL analysis.

The former workflow referenced unpinned actions, obsolete root-level frontend paths, non-blocking test commands, and placeholder deployment steps. It is intentionally no longer triggered by push, pull request, or schedule events.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical workflow
        run: |
          echo "This legacy workflow is archived."
          echo "Use .github/workflows/ci.yml and .github/workflows/codeql.yml."
