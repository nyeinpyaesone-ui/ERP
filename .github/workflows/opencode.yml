name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    # Guard against untrusted input: this job holds OPENCODE_API_KEY, so only
    # interactors with write access may trigger it. Without the association
    # check, any outside commenter (including a fork PR author) could invoke
    # the model and spend the key. Note the parentheses — bare `A && B || C`
    # would bind as `(A && B) || C` and leak the trigger to any commenter who
    # posts a bare "/oc".
    if: >-
      ${{
        (github.event.comment.user.type == 'User')
        && (contains(github.event.comment.body, ' /oc')
          || startsWith(github.event.comment.body, '/oc')
          || contains(github.event.comment.body, ' /opencode')
          || startsWith(github.event.comment.body, '/opencode'))
        && (contains(github.event.comment.author_association, 'MEMBER')
          || contains(github.event.comment.author_association, 'OWNER')
          || contains(github.event.comment.author_association, 'COLLABORATOR'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        # Pinned to anomalyco/opencode@907b3bc5 (2026-10-04); use Dependabot to track updates
        uses: anomalyco/opencode/github@907b3bc518fa48e90e8ec24dd327d13eee71c36c
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/muse-spark-1.3-contributor-free