name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  deployments: write
  statuses: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "detect --verbose --no-banner --redact"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff black mypy

      - name: Run Ruff
        run: |
          cd backend && ruff check .

      - name: Run Black
        run: |
          cd backend && black --check .

      - name: Run MyPy
        run: |
          cd backend && mypy app/ --ignore-missing-imports || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run ESLint
        run: |
          cd backend/frontend-react && npm run lint || true

      - name: Run TypeScript check
        run: |
          cd backend/frontend-react && npx tsc --noEmit || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Alembic migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test alembic upgrade head

      - name: Run backend tests
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test pytest --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run frontend tests
        run: |
          cd backend/frontend-react && npm test --if-present

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Build frontend
        run: |
          cd backend/frontend-react && npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: backend/frontend-react/dist/
          retention-days: 7

  docker-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USER }}/erp-solution-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT_BACKEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USER }}/erp-solution-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT_FRONTEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/frontend-react/dist/

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/frontend-react
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.event_name != 'pull_request'
    steps:
      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKER_USER }}/erp-solution-backend:sha-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKER_USER }}/erp-solution-frontend:sha-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif

      - name: Upload Trivy results frontend
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          environment: staging
          description: Deploy ${{ github.sha }} to staging
          ref: ${{ github.sha }}
          auto_inactive: true

      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Blue-Green
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            set -e
            cd /opt/erp-solution
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-backend:latest
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-frontend:latest
            ./scripts/deploy-blue-green.sh staging latest
          EOF
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}

      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          environment: production
          description: Deploy ${{ github.ref_name }} to production
          ref: ${{ github.sha }}
          auto_inactive: true

      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Blue-Green
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            set -e
            cd /opt/erp-solution
            VERSION=${{ github.ref_name }}
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-backend:${VERSION}
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-frontend:${VERSION}
            ./scripts/deploy-blue-green.sh production ${VERSION}
          EOF
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}

      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed