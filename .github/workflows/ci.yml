name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual re-run for recovery or a rollback without pushing a new commit.
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Approve a staging deployment of the selected main-branch commit"
        required: false
        default: false
        type: boolean
      deploy_production:
        description: "Approve a production deployment of the selected v* release tag"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Staging rollback target (sha-* or v*); requires deploy_staging=true"
        required: false
        type: string

# PR runs are isolated by ref and may be superseded. All non-PR runs share
# one lock so different release tags cannot race the same blue-green hosts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deployments' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write
  deployments: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # v3.0.0 breaking change: PR scans refuse to run without an explicit
        # token (push scans still pass without it) — this is what turned the
        # Dependabot github-actions PR red while main stayed green.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "detect --verbose --no-banner --redact"

  config:
    name: Deploy Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets cannot be read in a job-level `if`, so availability is detected
    # here and published as boolean outputs. Without this the pipeline was
    # unsatisfiable: the repository had no DOCKER_PAT_* secrets, so the Docker
    # Hub login step failed and the whole workflow was later disabled by hand.
    # Now an unconfigured repository still gets gitleaks, ruff, black, eslint,
    # pytest, vitest, the vite build and the image builds.
    outputs:
      docker_user: ${{ steps.detect.outputs.docker_user }}
      can_push: ${{ steps.detect.outputs.can_push }}
      can_deploy_staging: ${{ steps.detect.outputs.can_deploy_staging }}
      can_deploy_production: ${{ steps.detect.outputs.can_deploy_production }}
    steps:
      - name: Detect available configuration
        id: detect
        env:
          DOCKER_USER_VAR: ${{ vars.DOCKER_USER }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAT_BACKEND: ${{ secrets.DOCKER_PAT_BACKEND }}
          PAT_FRONTEND: ${{ secrets.DOCKER_PAT_FRONTEND }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DOMAIN_VAR: ${{ vars.STAGING_DOMAIN }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_DOMAIN_VAR: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          set -euo pipefail
          user="${DOCKER_USER_VAR:-local}"
          if [ -n "${DOCKER_USER_VAR}" ] && [[ ! "${DOCKER_USER_VAR}" =~ ^[a-z0-9][a-z0-9_-]{0,127}$ ]]; then
            echo "::error::DOCKER_USER must be a valid lowercase Docker Hub namespace."
            exit 1
          fi
          valid_domain() {
            [[ "$1" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          }
          if [ -n "${STAGING_DOMAIN_VAR}" ] && ! valid_domain "${STAGING_DOMAIN_VAR}"; then
            echo "::error::STAGING_DOMAIN must be a lowercase FQDN without scheme, port, or path."
            exit 1
          fi
          if [ -n "${PRODUCTION_DOMAIN_VAR}" ] && ! valid_domain "${PRODUCTION_DOMAIN_VAR}"; then
            echo "::error::PRODUCTION_DOMAIN must be a lowercase FQDN without scheme, port, or path."
            exit 1
          fi
          echo "docker_user=${user}" >> "$GITHUB_OUTPUT"

          if [ -n "${STAGING_HOST}" ] && [ "${STAGING_HOST}" = "${PRODUCTION_HOST}" ]; then
            echo "::error::Staging and production must use separate hosts; the Compose stack uses fixed container names."
            exit 1
          fi

          if [ -n "${STAGING_DOMAIN_VAR}" ] && [ "${STAGING_DOMAIN_VAR}" = "${PRODUCTION_DOMAIN_VAR}" ]; then
            echo "::error::STAGING_DOMAIN and PRODUCTION_DOMAIN must be different."
            exit 1
          fi

          can_push=false
          # Never publish from a pull request, even when repository secrets are available.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] \\
             && [ -n "${DOCKER_USER_VAR}" ] \\
             && [ -n "${PAT_BACKEND}" ] \\
             && [ -n "${PAT_FRONTEND}" ]; then
            can_push=true
          fi
          echo "can_push=${can_push}" >> "$GITHUB_OUTPUT"

          can_deploy_staging=false
          if [ "${can_push}" = true ] \
             && [ -n "${STAGING_SSH_KEY}" ] \
             && [ -n "${STAGING_KNOWN_HOSTS}" ] && [ -n "${STAGING_HOST}" ] && [ -n "${STAGING_USER}" ] \
             && [ -n "${STAGING_DOMAIN_VAR}" ] && valid_domain "${STAGING_DOMAIN_VAR}"; then
            can_deploy_staging=true
          fi
          echo "can_deploy_staging=${can_deploy_staging}" >> "$GITHUB_OUTPUT"

          can_deploy_production=false
          if [ "${can_push}" = true ] \
             && [ -n "${PRODUCTION_SSH_KEY}" ] \
             && [ -n "${PRODUCTION_KNOWN_HOSTS}" ] && [ -n "${PRODUCTION_HOST}" ] && [ -n "${PRODUCTION_USER}" ] \
             && [ -n "${PRODUCTION_DOMAIN_VAR}" ] && valid_domain "${PRODUCTION_DOMAIN_VAR}"; then
            can_deploy_production=true
          fi
          echo "can_deploy_production=${can_deploy_production}" >> "$GITHUB_OUTPUT"

          {
            echo "### Deploy configuration"
            echo ""
            echo "| Capability | Available |"
            echo "|---|---|"
            echo "| Image namespace | \`${user}\` |"
            echo "| Push images to Docker Hub | \`${can_push}\` |"
            echo "| Staging domain configured | \`$([ -n "${STAGING_DOMAIN_VAR}" ] && echo true || echo false)\` |"
            echo "| Staging deploy | \`${can_deploy_staging}\` |"
            echo "| Production domain configured | \`$([ -n "${PRODUCTION_DOMAIN_VAR}" ] && echo true || echo false)\` |"
            echo "| Production deploy | \`${can_deploy_production}\` |"
            echo ""
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "Pull requests build and scan images locally; registry publishing is disabled."
            elif [ "${can_push}" = false ]; then
              echo "DOCKER_USER and/or Docker Hub push tokens are unset, so images are"
              echo "built and validated locally but not pushed. See docs/GITHUB_SECRETS.md."
            fi
            if [ "${can_deploy_staging}" = false ]; then
              echo "Staging deploy is skipped until image push, staging SSH, pinned host keys, and STAGING_DOMAIN are configured."
            fi
            if [ "${can_deploy_production}" = false ]; then
              echo "Production deploy is skipped until image push, production SSH, pinned host keys, and PRODUCTION_DOMAIN are configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff black mypy

      - name: Run Ruff
        run: |
          cd backend && ruff check .

      - name: Run Black
        run: |
          cd backend && black --check .

      - name: Run MyPy (advisory — does not gate the pipeline)
        continue-on-error: true
        run: |
          cd backend && mypy app/ --ignore-missing-imports

      - name: Validate deployment scripts and Compose configuration
        run: |
          set -euo pipefail
          for script in \
            install.sh \
            scripts/lib.sh \
            scripts/deploy-blue-green.sh \
            scripts/configure-environment.sh \
            scripts/configure-github-actions.sh \
            scripts/configure-host-registry.sh \
            scripts/provision-k8s-secrets.sh; do
            bash -n "$script"
          done

          # Exercise the generator with disposable values. No generated secret
          # is printed or persisted outside this job's temporary directory.
          temp_env_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_env_dir"' EXIT
          bash scripts/configure-environment.sh \
            --environment staging \
            --domain staging.example.test \
            --docker-user example \
            --version sha-0123456 \
            --cors-origins "https://staging.example.test,https://admin.example.test" \
            --dir "$temp_env_dir"
          test "$(stat -c '%a' "$temp_env_dir/.env.staging")" = "600"
          grep -Fxq 'CORS_ORIGINS=https://staging.example.test,https://admin.example.test' "$temp_env_dir/.env.staging"
          docker compose --env-file "$temp_env_dir/.env.staging" -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.production.template -f docker-compose.prod.yml config --quiet

          # Render the Kubernetes scaffold as a validation-only path. This does
          # not apply resources or require a cluster context.
          if command -v kubectl >/dev/null 2>&1; then
            for environment in development staging production; do
              kubectl kustomize "infra/k8s/overlays/$environment" > "$temp_env_dir/k8s-$environment.yaml"
              test -s "$temp_env_dir/k8s-$environment.yaml"
            done
            grep -Fq '  namespace: erp-solution-dev' "$temp_env_dir/k8s-development.yaml"
            grep -Fq '  namespace: erp-solution-staging' "$temp_env_dir/k8s-staging.yaml"
            grep -Fq '  namespace: erp-solution' "$temp_env_dir/k8s-production.yaml"
            if grep -Eq '^  (name|namespace): erp_solution' "$temp_env_dir"/k8s-*.yaml; then
              echo "::error::Kubernetes output contains an invalid underscore-based resource name or namespace."
              exit 1
            fi
          elif command -v kustomize >/dev/null 2>&1; then
            for environment in development staging production; do
              kustomize build "infra/k8s/overlays/$environment" > "$temp_env_dir/k8s-$environment.yaml"
              test -s "$temp_env_dir/k8s-$environment.yaml"
            done
          else
            echo "::warning::kubectl/kustomize is unavailable; Kubernetes overlays were not rendered in this job."
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run ESLint (real; fails on errors — IMP-P0-4/IMP-P2-5)
        run: |
          cd backend/frontend-react && npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    # PostgreSQL backs the `alembic upgrade head` step below. Redis is
    # deliberately absent: tests mock redis.from_url and token_store fails
    # open, so a real server would only add startup latency.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Alembic migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test alembic upgrade head

      - name: Run backend tests
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run frontend tests
        run: |
          cd backend/frontend-react && npm test --if-present

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/frontend-react && npm ci

      # No artifact upload: the frontend image is built from source by
      # docker-frontend, and .dockerignore excludes dist/, so an uploaded
      # bundle would be discarded by the Docker build context.
      - name: Build frontend
        run: |
          cd backend/frontend-react && npm run build

  docker-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [test, config]
    # Build on PRs too; config forces PR images to load locally without publishing.
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha_tag: ${{ steps.immutable.outputs.image_tag }}
      image_sha_ref: ${{ steps.immutable.outputs.image_ref }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.config.outputs.docker_user }}/erp-solution-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Resolve immutable image reference
        id: immutable
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image_ref="$(printf '%s\n' "$IMAGE_TAGS" | grep -E "/erp-solution-backend:sha-[[:xdigit:]]+$" | tail -n1)"
          if [ -z "$image_ref" ]; then
            echo "::error::Docker metadata did not produce an immutable backend SHA tag."
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_ref##*:}" >> "$GITHUB_OUTPUT"

      # Skipped rather than attempted when the PAT is absent: a login step with
      # an empty password is what failed here and took the workflow offline.
      - name: Log in to Docker Hub
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_BACKEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds either way. Without a PAT the result is loaded locally so the
      # image is still verified; nothing is published.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: ${{ needs.config.outputs.can_push == 'true' }}
          load: ${{ needs.config.outputs.can_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-build, config]
    # Validate the image on PRs too; config keeps push disabled when secrets are unavailable.
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha_tag: ${{ steps.immutable.outputs.image_tag }}
      image_sha_ref: ${{ steps.immutable.outputs.image_ref }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.config.outputs.docker_user }}/erp-solution-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Resolve immutable image reference
        id: immutable
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image_ref="$(printf '%s\n' "$IMAGE_TAGS" | grep -E "/erp-solution-frontend:sha-[[:xdigit:]]+$" | tail -n1)"
          if [ -z "$image_ref" ]; then
            echo "::error::Docker metadata did not produce an immutable frontend SHA tag."
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_ref##*:}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_FRONTEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds from source (npm ci + vite build) rather than consuming the
      # frontend-build job's dist/: .dockerignore excludes dist/ from the
      # build context, so a downloaded bundle would be silently dropped.
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend/frontend-react
          push: ${{ needs.config.outputs.can_push == 'true' }}
          load: ${{ needs.config.outputs.can_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, config]
    # Scan locally loaded PR/unpublished images as well as published release images.
    if: >-
      always()
      && needs.docker-backend.result == 'success'
      && needs.docker-frontend.result == 'success'
      && needs.config.result == 'success'
    timeout-minutes: 20
    # Scan immutable SHA tags. HIGH/CRITICAL findings fail this job; SARIF
    # upload still runs so findings remain visible in GitHub code scanning.
    steps:
      - name: Log in to Docker Hub for backend scan
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_BACKEND }}

      - name: Run Trivy on backend
        id: trivy-backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ needs.docker-backend.outputs.image_sha_ref }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-backend.sarif

      - name: Log in to Docker Hub for frontend scan
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_FRONTEND }}

      - name: Run Trivy on frontend
        id: trivy-frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ needs.docker-frontend.outputs.image_sha_ref }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload Trivy backend results
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy frontend results
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Enforce image vulnerability gate
        if: always()
        env:
          BACKEND_SCAN: ${{ steps.trivy-backend.outcome }}
          FRONTEND_SCAN: ${{ steps.trivy-frontend.outcome }}
        run: |
          set -euo pipefail
          if [ "${BACKEND_SCAN}" != "success" ] || [ "${FRONTEND_SCAN}" != "success" ]; then
            echo "::error::Both image scans must complete successfully with no HIGH or CRITICAL findings."
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security, config]
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.deploy_staging == true
      && needs.config.outputs.can_deploy_staging == 'true'
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          environment: staging
          description: Deploy ${{ github.sha }} to staging
          ref: ${{ github.sha }}
          auto_inactive: true

      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Write pinned SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${KNOWN_HOSTS}" ]; then
            echo "::error::STAGING_KNOWN_HOSTS is empty; refusing unverified SSH."
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deployment version
        env:
          ROLLBACK_INPUT: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          if [ -n "${ROLLBACK_INPUT}" ] && [[ ! "${ROLLBACK_INPUT}" =~ ^(sha-[[:xdigit:]]{7,40}|v[0-9A-Za-z][0-9A-Za-z._-]{0,127})$ ]]; then
            echo "::error::Rollback tag must be a versioned v* release or a sha-* image tag."
            exit 1
          fi

      - name: Deploy or roll back with Blue-Green
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          ROLLBACK_INPUT: ${{ inputs.rollback }}
          IMAGE_SHA_TAG: ${{ needs.docker-backend.outputs.image_sha_tag }}
          FRONTEND_SHA_TAG: ${{ needs.docker-frontend.outputs.image_sha_tag }}
        run: |
          set -euo pipefail
          VERSION="${ROLLBACK_INPUT:-${IMAGE_SHA_TAG}}"
          if [ -z "${VERSION}" ] || { [ -z "${ROLLBACK_INPUT}" ] && [ "${IMAGE_SHA_TAG}" != "${FRONTEND_SHA_TAG}" ]; }; then
            echo "::error::Backend and frontend immutable image tags are missing or do not match."
            exit 1
          fi
          ACTION="deploy"
          if [ -n "${ROLLBACK_INPUT}" ]; then ACTION="rollback"; fi
          TARGET="${STAGING_USER}@${STAGING_HOST}"
          DEPLOY_TMP="/tmp/erp-deploy-${GITHUB_RUN_ID}"

          # Ship the exact deployment script and Compose/nginx config from this commit.
          tar -czf - scripts/deploy-blue-green.sh scripts/lib.sh docker-compose.prod.yml nginx.conf nginx/upstream-blue.conf nginx/upstream-green.conf |
            ssh "${TARGET}" "mkdir -p '${DEPLOY_TMP}' && tar -xzf - -C '${DEPLOY_TMP}'"

          ssh "${TARGET}" bash -s -- "${DOCKER_USER}" "${VERSION}" "${ACTION}" "${GITHUB_RUN_ID}" <<'REMOTE'
          set -euo pipefail
          DOCKER_USER="$1"
          VERSION="$2"
          ACTION="$3"
          DEPLOY_TMP="/tmp/erp-deploy-$4"
          export DOCKER_USER VERSION
          cd /opt/erp-solution
          install -D -m 0755 "$DEPLOY_TMP/scripts/deploy-blue-green.sh" scripts/deploy-blue-green.sh
          install -D -m 0644 "$DEPLOY_TMP/scripts/lib.sh" scripts/lib.sh
          install -D -m 0644 "$DEPLOY_TMP/docker-compose.prod.yml" docker-compose.prod.yml
          test -f nginx.conf || { echo "nginx.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx.conf" > nginx.conf
          chmod 0644 nginx.conf
          test -f nginx/upstream-blue.conf || { echo "nginx/upstream-blue.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx/upstream-blue.conf" > nginx/upstream-blue.conf
          chmod 0644 nginx/upstream-blue.conf
          test -f nginx/upstream-green.conf || { echo "nginx/upstream-green.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx/upstream-green.conf" > nginx/upstream-green.conf
          chmod 0644 nginx/upstream-green.conf
          rm -rf "$DEPLOY_TMP"
          if [ "$ACTION" = "rollback" ]; then
            ./scripts/deploy-blue-green.sh staging "$VERSION" --rollback
          else
            ./scripts/deploy-blue-green.sh staging "$VERSION"
          fi
          REMOTE
      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security, config]
    if: >-
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && inputs.deploy_production == true
      && needs.config.outputs.can_deploy_production == 'true'
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          environment: production
          description: Deploy ${{ github.ref_name }} to production
          ref: ${{ github.sha }}
          auto_inactive: true
      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "::error::Release tag is not a valid immutable deployment tag."
            exit 1
          fi
      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      - name: Write pinned SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${KNOWN_HOSTS}" ]; then
            echo "::error::PRODUCTION_KNOWN_HOSTS is empty; refusing unverified SSH."
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy release with Blue-Green
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TARGET="${PRODUCTION_USER}@${PRODUCTION_HOST}"
          DEPLOY_TMP="/tmp/erp-deploy-${GITHUB_RUN_ID}"

          # Ship the exact deployment script and Compose/nginx config from this tag.
          tar -czf - scripts/deploy-blue-green.sh scripts/lib.sh docker-compose.prod.yml nginx.conf nginx/upstream-blue.conf nginx/upstream-green.conf |
            ssh "${TARGET}" "mkdir -p '${DEPLOY_TMP}' && tar -xzf - -C '${DEPLOY_TMP}'"

          ssh "${TARGET}" bash -s -- "${DOCKER_USER}" "${RELEASE_VERSION}" "${GITHUB_RUN_ID}" <<'REMOTE'
          set -euo pipefail
          DOCKER_USER="$1"
          VERSION="$2"
          DEPLOY_TMP="/tmp/erp-deploy-$3"
          export DOCKER_USER VERSION
          cd /opt/erp-solution
          install -D -m 0755 "$DEPLOY_TMP/scripts/deploy-blue-green.sh" scripts/deploy-blue-green.sh
          install -D -m 0644 "$DEPLOY_TMP/scripts/lib.sh" scripts/lib.sh
          install -D -m 0644 "$DEPLOY_TMP/docker-compose.prod.yml" docker-compose.prod.yml
          test -f nginx.conf || { echo "nginx.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx.conf" > nginx.conf
          chmod 0644 nginx.conf
          test -f nginx/upstream-blue.conf || { echo "nginx/upstream-blue.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx/upstream-blue.conf" > nginx/upstream-blue.conf
          chmod 0644 nginx/upstream-blue.conf
          test -f nginx/upstream-green.conf || { echo "nginx/upstream-green.conf missing on target host"; exit 1; }
          cat "$DEPLOY_TMP/nginx/upstream-green.conf" > nginx/upstream-green.conf
          chmod 0644 nginx/upstream-green.conf
          rm -rf "$DEPLOY_TMP"
          ./scripts/deploy-blue-green.sh production "$VERSION"
          REMOTE
      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed
