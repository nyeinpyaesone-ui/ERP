name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual re-run for recovery or a rollback without pushing a new commit.
  workflow_dispatch:
    inputs:
      rollback:
        description: "Version to roll back to on the staging environment (blank = normal deploy)"
        required: false
        type: string

# Overlapping pushes must not race each other through the blue-green deploy.
# Superseded runs on a branch are cancelled; deploy-relevant refs are serialized.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  deployments: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          args: "detect --verbose --no-banner --redact"

  config:
    name: Deploy Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets cannot be read in a job-level `if`, so availability is detected
    # here and published as boolean outputs. Without this the pipeline was
    # unsatisfiable: the repository had no DOCKER_PAT_* secrets, so the Docker
    # Hub login step failed and the whole workflow was later disabled by hand.
    # Now an unconfigured repository still gets gitleaks, ruff, black, eslint,
    # pytest, vitest, the vite build and the image builds.
    outputs:
      docker_user: ${{ steps.detect.outputs.docker_user }}
      can_push: ${{ steps.detect.outputs.can_push }}
      can_deploy: ${{ steps.detect.outputs.can_deploy }}
    steps:
      - name: Detect available configuration
        id: detect
        env:
          DOCKER_USER_VAR: ${{ vars.DOCKER_USER }}
          PAT_BACKEND: ${{ secrets.DOCKER_PAT_BACKEND }}
          PAT_FRONTEND: ${{ secrets.DOCKER_PAT_FRONTEND }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          user="${DOCKER_USER_VAR:-powerrangeranikg}"
          echo "docker_user=${user}" >> "$GITHUB_OUTPUT"

          can_push=false
          if [ -n "${DOCKER_USER_VAR}" ] && [ -n "${PAT_BACKEND}" ] && [ -n "${PAT_FRONTEND}" ]; then
            can_push=true
          fi
          echo "can_push=${can_push}" >> "$GITHUB_OUTPUT"

          can_deploy=false
          if [ "${can_push}" = true ] \
             && [ -n "${SSH_KEY}" ] \
             && [ -n "${STAGING_KNOWN_HOSTS}" ] && [ -n "${STAGING_HOST}" ] && [ -n "${STAGING_USER}" ] \
             && [ -n "${PRODUCTION_KNOWN_HOSTS}" ] && [ -n "${PRODUCTION_HOST}" ] && [ -n "${PRODUCTION_USER}" ]; then
            can_deploy=true
          fi
          echo "can_deploy=${can_deploy}" >> "$GITHUB_OUTPUT"

          {
            echo "### Deploy configuration"
            echo ""
            echo "| Capability | Available |"
            echo "|---|---|"
            echo "| Image namespace | \`${user}\` |"
            echo "| Push images to Docker Hub | \`${can_push}\` |"
            echo "| Deploy over SSH | \`${can_deploy}\` |"
            echo ""
            if [ "${can_push}" = false ]; then
              echo "DOCKER_PAT_BACKEND / DOCKER_PAT_FRONTEND are unset, so images are"
              echo "built and validated but not pushed. See docs/GITHUB_SECRETS.md."
            fi
            if [ "${can_deploy}" = false ]; then
              echo "Deploy jobs are skipped until the SSH and known-hosts secrets exist."
              echo "They fail closed by design rather than deploy with unverified hosts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff black mypy

      - name: Run Ruff
        run: |
          cd backend && ruff check .

      - name: Run Black
        run: |
          cd backend && black --check .

      - name: Run MyPy (advisory — does not gate the pipeline)
        continue-on-error: true
        run: |
          cd backend && mypy app/ --ignore-missing-imports

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run ESLint (real; fails on errors — IMP-P0-4/IMP-P2-5)
        run: |
          cd backend/frontend-react && npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    # PostgreSQL backs the `alembic upgrade head` step below. Redis is
    # deliberately absent: tests mock redis.from_url and token_store fails
    # open, so a real server would only add startup latency.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Alembic migrations
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test alembic upgrade head

      - name: Run backend tests
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend

      - name: Install frontend dependencies
        run: |
          cd backend/frontend-react && npm ci

      - name: Run frontend tests
        run: |
          cd backend/frontend-react && npm test --if-present

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/frontend-react/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/frontend-react && npm ci

      # No artifact upload: the frontend image is built from source by
      # docker-frontend, and .dockerignore excludes dist/, so an uploaded
      # bundle would be discarded by the Docker build context.
      - name: Build frontend
        run: |
          cd backend/frontend-react && npm run build

  docker-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [test, config]
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.config.outputs.docker_user }}/erp-solution-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      # Skipped rather than attempted when the PAT is absent: a login step with
      # an empty password is what failed here and took the workflow offline.
      - name: Log in to Docker Hub
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_BACKEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds either way. Without a PAT the result is loaded locally so the
      # image is still verified; nothing is published.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: ${{ needs.config.outputs.can_push == 'true' }}
          load: ${{ needs.config.outputs.can_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-build, config]
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.config.outputs.docker_user }}/erp-solution-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Log in to Docker Hub
        if: needs.config.outputs.can_push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ needs.config.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PAT_FRONTEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds from source (npm ci + vite build) rather than consuming the
      # frontend-build job's dist/: .dockerignore excludes dist/ from the
      # build context, so a downloaded bundle would be silently dropped.
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend/frontend-react
          push: ${{ needs.config.outputs.can_push == 'true' }}
          load: ${{ needs.config.outputs.can_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, config]
    # Trivy resolves image-ref against the registry, so it only runs once the
    # images are actually published.
    if: github.event_name != 'pull_request' && needs.config.outputs.can_push == 'true'
    timeout-minutes: 20
    # image-ref comes from the build jobs' own metadata-action output. The
    # previous hardcoded `sha-${{ github.sha }}` used the full 40-char commit
    # while metadata-action's `type=sha` pushes a 7-char short SHA, so these
    # scans referenced a tag that was never published.
    steps:
      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ needs.docker-backend.outputs.image_tag }}
          format: sarif
          output: trivy-backend.sarif

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ needs.docker-frontend.outputs.image_tag }}
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload Trivy backend results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy frontend results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security, config]
    # can_deploy covers the SSH key, both hosts and both pinned known_hosts sets.
    # Absent any of them the job is skipped rather than failed, so the pipeline
    # stays green on a repository that has not been provisioned for deploys yet.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.config.outputs.can_deploy == 'true'
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          environment: staging
          description: Deploy ${{ github.sha }} to staging
          ref: ${{ github.sha }}
          auto_inactive: true

      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned host keys from the STAGING_KNOWN_HOSTS secret. ssh-keyscan is
      # unauthenticated and MITM-able, so it is no longer used. Populate the
      # secret with: ssh-keyscan -H <staging-host>  (see docs/GITHUB_SECRETS.md)
      - name: Write pinned SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "${KNOWN_HOSTS}" ]; then
            echo "::error::STAGING_KNOWN_HOSTS secret is empty — refusing to deploy without host verification."
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts

      # With `rollback` set, hand off to the script's --rollback path for that
      # version instead of deploying latest.
      - name: Deploy with Blue-Green
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          VERSION="latest"
          ACTION="deploy"
          if [ -n "${ROLLBACK}" ]; then
            VERSION="${ROLLBACK}"
            ACTION="rollback"
            docker pull "${DOCKER_USER}/erp-solution-backend:${VERSION}"
            docker pull "${DOCKER_USER}/erp-solution-frontend:${VERSION}"
          else
            docker pull "${DOCKER_USER}/erp-solution-backend:latest"
            docker pull "${DOCKER_USER}/erp-solution-frontend:latest"
          fi
          ssh "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" << EOF
            set -euo pipefail
            cd /opt/erp-solution
            docker pull ${DOCKER_USER}/erp-solution-backend:${VERSION}
            docker pull ${DOCKER_USER}/erp-solution-frontend:${VERSION}
            if [ "${ACTION}" = "rollback" ]; then
              ./scripts/deploy-blue-green.sh staging ${VERSION} --rollback
            else
              ./scripts/deploy-blue-green.sh staging ${VERSION}
            fi
          EOF

      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.STAGING_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, security, config]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.config.outputs.can_deploy == 'true'
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          environment: production
          description: Deploy ${{ github.ref_name }} to production
          ref: ${{ github.sha }}
          auto_inactive: true

      - name: Set deployment status to in_progress
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned host keys from the PRODUCTION_KNOWN_HOSTS secret; see the
      # staging job for rationale. Populate with: ssh-keyscan -H <prod-host>
      - name: Write pinned SSH known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "${KNOWN_HOSTS}" ]; then
            echo "::error::PRODUCTION_KNOWN_HOSTS secret is empty — refusing to deploy without host verification."
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts

      - name: Deploy with Blue-Green
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            set -e
            cd /opt/erp-solution
            VERSION=${{ github.ref_name }}
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-backend:${VERSION}
            docker pull ${{ vars.DOCKER_USER }}/erp-solution-frontend:${VERSION}
            ./scripts/deploy-blue-green.sh production ${VERSION}
          EOF
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}

      - name: Set deployment status to success
        if: success()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Set deployment status to failure
        if: failure()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: ${{ github.token }}
          target_url: https://${{ vars.PRODUCTION_DOMAIN }}
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          description: Deployment failed