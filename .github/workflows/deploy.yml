name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - staging
          - production
      version:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'
      rollback:
        description: 'Rollback to previous version'
        type: boolean
        required: false
        default: false

  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'backend/frontend-react/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: read
  id-token: write

env:
  DOCKER_USER: ${{ vars.DOCKER_USER }}
  REGISTRY: docker.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      rollback: ${{ steps.set-version.outputs.rollback }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version and rollback
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "rollback=${{ github.event.inputs.rollback }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "rollback=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate required secrets
        run: |
          REQUIRED_SECRETS=(
            "DOCKER_PAT_BACKEND"
            "DOCKER_PAT_FRONTEND"
            "DB_PASSWORD"
            "REDIS_PASSWORD"
            "SECRET_KEY"
          )
          
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${{ secrets[$secret] }}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done
          echo "All required secrets present"

      - name: Verify Docker images exist
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          IMAGES=(
            "${{ env.DOCKER_USER }}/erp-solution-backend:${VERSION}"
            "${{ env.DOCKER_USER }}/erp-solution-frontend:${VERSION}"
          )
          
          for image in "${IMAGES[@]}"; do
            if ! docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "::error::Docker image not found: $image"
              exit 1
            fi
            echo "Image exists: $image"
          done

  deploy-staging:
    name: Deploy Staging
    needs: validate
    if: github.event.inputs.environment == 'staging' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}

      - name: Deploy to staging
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ROLLBACK="${{ needs.validate.outputs.rollback }}"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }} \
            "cd /opt/erp-solution && \
             VERSION=${VERSION} \
             DOCKER_USER=${{ env.DOCKER_USER }} \
             DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
             REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
             SECRET_KEY=${{ secrets.SECRET_KEY }} \
             CORS_ORIGINS=${{ secrets.CORS_ORIGINS_STAGING }} \
             API_URL=${{ secrets.API_URL_STAGING }} \
             WS_URL=${{ secrets.WS_URL_STAGING }} \
             ./scripts/deploy-blue-green.sh staging ${VERSION} ${ROLLBACK}"

  deploy-production:
    name: Deploy Production
    needs: validate
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Deploy to production
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ROLLBACK="${{ needs.validate.outputs.rollback }}"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} \
            "cd /opt/erp-solution && \
             VERSION=${VERSION} \
             DOCKER_USER=${{ env.DOCKER_USER }} \
             DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
             REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
             SECRET_KEY=${{ secrets.SECRET_KEY }} \
             CORS_ORIGINS=${{ secrets.CORS_ORIGINS_PROD }} \
             API_URL=${{ secrets.API_URL_PROD }} \
             WS_URL=${{ secrets.WS_URL_PROD }} \
             ./scripts/deploy-blue-green.sh production ${VERSION} ${ROLLBACK}"

      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment successful!"
          # Add Slack/Discord notification here if needed

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Deployment failed!"
          # Add Slack/Discord notification here if needed

  post-deploy-smoke-tests:
    name: Post-Deploy Smoke Tests
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke tests
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'staging' }}"
          
          if [ "$ENVIRONMENT" = "production" ]; then
            API_URL="${{ secrets.API_URL_PROD }}"
          else
            API_URL="${{ secrets.API_URL_STAGING }}"
          fi
          
          echo "Running smoke tests against $API_URL"
          
          # Health check
          if ! curl -sf "$API_URL/health" | grep -q "healthy"; then
            echo "Health check failed"
            exit 1
          fi
          
          # Readiness check
          if ! curl -sf "$API_URL/ready" | grep -q "ready"; then
            echo "Readiness check failed"
            exit 1
          fi
          
          # API root
          if ! curl -sf "$API_URL/" | grep -q "running"; then
            echo "API root check failed"
            exit 1
          fi
          
          echo "All smoke tests passed"