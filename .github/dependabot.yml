version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      # Batches minor/patch bumps into one PR. Without grouping every minor
      # lands separately — the backlog reached 37 open branches.
      python-dependencies:
        update-types:
          - "minor"
          - "patch"

  # Node.js dependencies (Frontend)
  - package-ecosystem: "npm"
    directory: "/backend/frontend-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      frontend-dependencies:
        update-types:
          - "minor"
          - "patch"

  # Node.js dependencies (Mobile)
  # Note: /mobile has no lockfile, so Dependabot resolves from package.json only.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "mobile"
    groups:
      # Expo/React Native majors are a coordinated upgrade; batching keeps the
      # combined PR reviewable instead of ~20 interdependent ones.
      mobile-dependencies:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — workflows pin every `uses:` to a commit SHA with a
  # `# vX.Y.Z` comment, which Dependabot updates natively.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Workflows pin every `uses:` to a commit SHA with a `# vX.Y.Z` comment,
      # which Dependabot updates natively — so one grouped PR covers all of them.
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # ── Docker base images ─────────────────────────────────────────────────────
  # Previously unmonitored: python:3.11-slim, node:20-alpine and
  # postgres:15-alpine could go months without a patch PR.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend/frontend-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        update-types:
          - "minor"
          - "patch"