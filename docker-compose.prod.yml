version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-erp_solution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # No ports published in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d ${DB_NAME:-erp_solution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No ports published in production
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Backend API (Blue - Primary)
  backend:
    image: ${DOCKER_USER:-powerrangeranikg}/erp-solution-backend:${VERSION:-latest}
    container_name: erp-blue-backend
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-erp}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-erp_solution}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - backend_logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Backend API (Green - Staging/Blue-Green)
  backend-green:
    image: ${DOCKER_USER:-powerrangeranikg}/erp-solution-backend:${VERSION:-latest}
    container_name: erp-green-backend
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-erp}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-erp_solution}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - backend_logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - blue-green

  # Frontend Web App (Blue - Primary)
  frontend:
    image: ${DOCKER_USER:-powerrangeranikg}/erp-solution-frontend:${VERSION:-latest}
    container_name: erp-blue-frontend
    restart: unless-stopped
    # Frontend image contains built dist/ from build; no volume needed
    networks:
      - erp-network
    depends_on:
      - backend

  # Frontend Web App (Green - Staging/Blue-Green)
  frontend-green:
    image: ${DOCKER_USER:-powerrangeranikg}/erp-solution-frontend:${VERSION:-latest}
    container_name: erp-green-frontend
    restart: unless-stopped
    networks:
      - erp-network
    depends_on:
      - backend-green
    profiles:
      - blue-green

  # Ollama AI Service (internal only)
  ollama:
    image: ollama/ollama:latest
    container_name: erp-ollama
    restart: unless-stopped
    # No ports published - internal access only
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - erp-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream-blue.conf:/etc/nginx/conf.d/upstream-blue.conf:ro
      - ./nginx/upstream-green.conf:/etc/nginx/conf.d/upstream-green.conf:ro
      - ./nginx/upstream-active.conf:/etc/nginx/conf.d/upstream-active.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - erp-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  backend_logs:

networks:
  erp-network:
    driver: bridge