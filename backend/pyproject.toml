[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-solution-backend"
version = "1.0.0"
description = "ERP Solution Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008", "T201"]

[tool.ruff.lint.per-file-ignores]
"app/scripts/*.py" = ["T201"]
"app/tests/*.py" = ["T201", "S101"]
"alembic/versions/*.py" = ["T201", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | htmlcov
  | dist
  | build
  | node_modules
)
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
strict_optional = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "sqlalchemy.*",
    "pydantic.*",
    "fastapi.*",
    "starlette.*",
    "jose.*",
    "passlib.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/alembic/*",
    "*/scripts/*",
    "*/scripts/*.py",
    "*/entrypoint.sh",
    "*/__main__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]
# Ratchet: set to the measured floor, raise as coverage grows. Was 80 with
# ~3 tests (unreachable); actual is 58.33%.
fail_under = 58
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --asyncio-mode=auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "smoke: Smoke tests for CI",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true