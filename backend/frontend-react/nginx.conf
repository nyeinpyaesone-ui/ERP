# Included from http {} via /etc/nginx/nginx.conf's conf.d include, so the
# map below is valid at this level.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Document uploads go through /api/v1/documents; nginx would otherwise
    # reject anything over the 1 MB default with 413.
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend lives at /api/v1/..., including the WebSocket at /api/v1/ws.
    # proxy_pass has no URI, so the full original path is passed through.
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the WebSocket handshake; a no-op for ordinary requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
