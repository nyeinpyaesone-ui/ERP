# Alembic Configuration File
# This file is required by alembic to run migrations

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://erp_user:erp_password@localhost:5432/erp_db
# Note: This is overridden by alembic/env.py using settings.DATABASE_URL from config.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
