# Main nginx configuration for the production stack.
# docker-compose.prod.yml mounts this file at /etc/nginx/nginx.conf.
#
# Kept boot-safe: TLS server blocks live in conf.d/ssl.conf, which ships as a
# comment-only placeholder (nginx/ssl.conf) and is overwritten by
# scripts/setup-ssl.sh once certificates exist.  This file therefore starts
# cleanly with no ssl/ directory at all.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    sendfile on;
    keepalive_timeout 65;

    # Client body size for file uploads (/api/v1/documents); the 1 MB default
    # returns 413.
    client_max_body_size 50M;

    # WebSocket connection upgrade map, referenced by the /api locations below
    # so an ordinary request still gets Connection: close rather than a
    # dangling "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting zones.  Declared here so both the HTTP server below and
    # the TLS servers in conf.d/ssl.conf can reference them.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Blue/green upstreams, flipped by scripts/deploy-blue-green.sh.
    include /etc/nginx/conf.d/upstream-active.conf;

    # TLS servers, written by scripts/setup-ssl.sh over nginx/ssl.conf.
    include /etc/nginx/conf.d/ssl.conf;

    server {
        # default_server so requests by IP or an unmatched hostname still
        # reach the app.  Once setup-ssl.sh has run, its domain-specific
        # port-80 block redirects that domain to HTTPS instead.
        listen 80 default_server;
        server_name _;

        # Rate limit for auth endpoints
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend, including the WebSocket at /api/v1/ws.  proxy_pass carries
        # no URI, so the original path is forwarded unchanged.
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Health checks, no auth and no rate limit
        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        location /ready {
            proxy_pass http://backend;
            access_log off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
